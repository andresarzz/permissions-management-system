name: SQL Server Integration Smoke Tests

on:
  push:
    branches:
      - portfolio-fixes-2026-10-31
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sql-server-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: "SqlServer-CI-Only-2026!Secure"
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'SqlServer-CI-Only-2026!Secure' -Q 'SELECT 1' -C || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 45s
    env:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://127.0.0.1:5050
      ASPNETCORE_HTTPS_PORT: ""
      ConnectionStrings__DefaultConnection: "Server=127.0.0.1,1433;Database=SistemaPermisosSmoke;User Id=sa;Password=SqlServer-CI-Only-2026!Secure;Encrypt=True;TrustServerCertificate=True"
      SeedData__Enabled: "false"
      SmokeTests__UseCurrentModelSchema: "true"
      SMOKE_TEST_PASSWORD: "Smoke-User-Password-2026!"
      SMOKE_BASE_URL: "http://127.0.0.1:5050"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build application
        run: dotnet build SistemaPermisos/SistemaPermisos.csproj --configuration Release
      - name: Start app with fresh SQL Server and verify migrations
        shell: bash
        run: |
          dotnet run --no-launch-profile --project SistemaPermisos --no-build --configuration Release > /tmp/sistema-permisos-app.log 2>&1 &
          echo $! > /tmp/sistema-permisos-app.pid
          ready=0
          for attempt in {1..35}; do
            if curl -fsS --max-time 3 -o /dev/null "http://127.0.0.1:5050/Account/Register"; then
              ready=1
              break
            fi
            if ! kill -0 "$(cat /tmp/sistema-permisos-app.pid)" 2>/dev/null; then
              echo "App exited during initialization"
              break
            fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then
            echo "Database migration or HTTP startup failed"
            sed -E 's/Password=[^; ]+/Password=[REDACTED]/g' /tmp/sistema-permisos-app.log | tail -n 100
            exit 1
          fi
      - name: Exercise registration, role enforcement, login, requests and reports
        run: python3 tests/sqlserver_smoke.py
      - name: Diagnose application errors if smoke test fails
        if: failure()
        shell: bash
        run: |
          if [ -f /tmp/sistema-permisos-app.log ]; then
            grep -A 24 -E "fail:|error:|Exception:" /tmp/sistema-permisos-app.log | tail -n 150 | sed -E 's/Password=[^; ]+/Password=[REDACTED]/g' || true
          fi
      - name: Stop application
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/sistema-permisos-app.pid ]; then
            kill "$(cat /tmp/sistema-permisos-app.pid)" || true
          fi
